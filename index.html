<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KEREMMA — où est le bateau ?</title>
<meta name="description" content="Position et parcours du voilier KEREMMA, mis à jour depuis le bord.">
<meta name="theme-color" content="#13304f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 25 28 16 22 7 28Z' fill='%23ff5a1f' stroke='%2313304f' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --ink:#13233a; --muted:#56677c; --line:#d6dee7; --panel:#ffffff;
  --navy:#13304f; --track:#ff5a1f; --track-gap:#8a98a8; --focus:#1f6feb;
  --shadow:0 10px 30px rgba(19,48,79,.18), 0 1px 3px rgba(19,48,79,.12);
}
@media (prefers-color-scheme:dark){
  :root{ --ink:#e7edf4; --muted:#9fb0c3; --line:#2b3d55; --panel:#15253a; --navy:#0d1c2e; --track-gap:#7d8da0; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#aad3df}
body{font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-stretch:100%}
#map{position:fixed;inset:0}
.leaflet-container{font:inherit;background:#aad3df}

/* Panneau */
.panel{
  position:fixed; left:16px; bottom:16px; z-index:1000; width:340px; max-width:calc(100vw - 32px);
  background:var(--panel); border-radius:14px; box-shadow:var(--shadow);
  padding:18px 20px 16px; line-height:1.4;
}
.name{
  margin:0; font-size:34px; line-height:1; font-weight:800; font-stretch:125%;
  letter-spacing:.04em; color:var(--ink);
}
.name small{display:block;margin-top:6px;font-size:13px;font-weight:400;font-stretch:100%;letter-spacing:0;color:var(--muted)}
.when{margin:14px 0 0;font-size:15px}
.when strong{font-weight:650}
.when .abs{display:block;color:var(--muted);font-size:13px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:1px}
.live.on{background:#21a366;box-shadow:0 0 0 0 rgba(33,163,102,.5);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{to{box-shadow:0 0 0 9px rgba(33,163,102,0)}}
@media (prefers-reduced-motion:reduce){.live.on{animation:none}}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:14px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.figs div{padding:10px 0 9px}
.figs div+div{padding-left:12px;border-left:1px solid var(--line)}
.figs dt{font-size:12px;color:var(--muted)}
.figs dd{margin:2px 0 0;font-size:22px;font-weight:650;font-stretch:88%;font-variant-numeric:tabular-nums;white-space:nowrap}
.figs dd span{font-size:13px;font-weight:400;color:var(--muted);margin-left:2px}
.trip{margin:12px 0 0;font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{
  flex:1; min-height:40px; border-radius:9px; border:1px solid var(--line); background:transparent;
  color:var(--ink); font:inherit; font-size:14px; font-weight:550; cursor:pointer;
}
.actions button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.actions button:hover{border-color:var(--muted)}
button:focus-visible,.leaflet-bar a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.toggle{position:absolute;top:12px;right:12px;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;display:none}
.msg{margin:14px 0 0;font-size:14px;color:var(--muted)}

/* Bateau */
.boat{transition:transform .3s}
.boat svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}

/* Popups */
.leaflet-popup-content-wrapper{border-radius:12px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:14px 16px;font-size:14px;line-height:1.45;min-width:200px}
.leaflet-popup-content .pp-date{font-size:17px;font-weight:700;font-stretch:92%;margin:0}
.leaflet-popup-content .pp-sub{margin:2px 0 10px;color:var(--muted);font-size:12.5px}
.pp table{border-collapse:collapse;width:100%}
.pp td{padding:3px 0;font-variant-numeric:tabular-nums}
.pp td:first-child{color:var(--muted);padding-right:14px}
.pp td:last-child{text-align:right;font-weight:550}
.pp-nav{display:flex;justify-content:space-between;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.pp-nav button{border:0;background:none;color:var(--focus);font:inherit;font-size:13px;cursor:pointer;padding:4px 0}
.pp-nav button:disabled{color:var(--muted);opacity:.5;cursor:default}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}

@media (max-width:600px){
  .panel{left:0;right:0;bottom:0;width:auto;max-width:none;border-radius:16px 16px 0 0;padding:16px 16px calc(14px + env(safe-area-inset-bottom))}
  .name{font-size:28px}
  .toggle{display:block}
  .panel.min .figs,.panel.min .trip,.panel.min .actions{display:none}
  .leaflet-bottom.leaflet-right{bottom:var(--sheet,0px)}
}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Carte du parcours de KEREMMA"></div>

<section class="panel" id="panel" aria-live="polite">
  <button class="toggle" id="toggle" aria-label="Réduire le panneau" aria-expanded="true">▾</button>
  <h1 class="name">KEREMMA<small>Voilier Harmony 38, MMSI 227383420</small></h1>
  <div id="content"><p class="msg">Chargement du parcours…</p></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
"use strict";
const GAP_S = 3 * 3600;            // au-delà : système éteint, segment en pointillés
const LIVE_S = 30 * 60;            // point récent : pastille verte
const REFRESH_MS = 5 * 60 * 1000;
const DOTS_MIN_ZOOM = 10, DOTS_MAX = 2500, HIT_PX = 16;

const fmtDate = new Intl.DateTimeFormat("fr-FR", {weekday:"short", day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit"});
const fmtShort = new Intl.DateTimeFormat("fr-FR", {day:"numeric", month:"long", year:"numeric"});
const fmtUTC = new Intl.DateTimeFormat("fr-FR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit", timeZone:"UTC"});
const nf1 = new Intl.NumberFormat("fr-FR", {maximumFractionDigits:1, minimumFractionDigits:1});
const nf0 = new Intl.NumberFormat("fr-FR", {maximumFractionDigits:0});

// ---------- carte
const map = L.map("map", {preferCanvas:true, zoomControl:false, worldCopyJump:true, attributionControl:true});
L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
const seamarks = L.tileLayer("https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png", {
  maxZoom:18, attribution:'© <a href="https://www.openseamap.org">OpenSeaMap</a>'
}).addTo(map);
L.control.layers(null, {"Balisage (OpenSeaMap)": seamarks}, {position:"bottomright"}).addTo(map);
map.setView([46.5, -4], 6);

const renderer = L.canvas({padding:.5});
const trackLayer = L.layerGroup().addTo(map);
const dotLayer = L.layerGroup().addTo(map);
let boatMarker = null, hilite = null;
let pts = [], latest = null, lastUpdated = null, firstLoad = true;

// ---------- données
async function getJSON(url){
  const r = await fetch(url, {cache:"no-cache"});
  if (!r.ok) throw new Error(r.status + " " + url);
  return r.json();
}
async function load(){
  let lt;
  try { lt = await getJSON("data/latest.json?_=" + Date.now()); }
  catch(e){ if (firstLoad) showEmpty(); return; }
  if (!lt.last){ showEmpty(); return; }
  if (lt.updated === lastUpdated && !firstLoad){ renderPanel(); return; }
  const files = await Promise.all((lt.months||[]).map(m =>
    getJSON(`data/${m}.json?v=${lt.updated}`).catch(() => ({points:[]}))));
  const all = files.flatMap(f => f.points || []);
  all.sort((a,b) => a[0]-b[0]);
  pts = all.map(r => ({t:r[0], lat:r[1], lon:r[2], sog:r[3], cog:r[4], hdg:r[5]}));
  latest = lt; lastUpdated = lt.updated;
  draw();
  renderPanel();
  if (firstLoad){ fitAll(); firstLoad = false; }
}

// ---------- tracé
function draw(){
  trackLayer.clearLayers();
  if (!pts.length) return;
  let seg = [[pts[0].lat, pts[0].lon]];
  const solid = [], gaps = [];
  for (let i = 1; i < pts.length; i++){
    const p = pts[i], q = pts[i-1], ll = [p.lat, p.lon];
    if (p.t - q.t > GAP_S){ solid.push(seg); gaps.push([[q.lat,q.lon], ll]); seg = [ll]; }
    else seg.push(ll);
  }
  solid.push(seg);
  L.polyline(gaps, {renderer, color:"#8a98a8", weight:2, dashArray:"4 7", interactive:false}).addTo(trackLayer);
  L.polyline(solid, {renderer, color:"#ffffff", weight:6, opacity:.7, interactive:false}).addTo(trackLayer);
  L.polyline(solid, {renderer, color:"#ff5a1f", weight:3, interactive:false}).addTo(trackLayer);

  const last = pts[pts.length-1];
  const dir = last.hdg ?? last.cog;
  const moving = last.sog != null && last.sog >= 0.5 && dir != null;
  const svg = moving
    ? `<svg width="30" height="30" viewBox="0 0 32 32" style="transform:rotate(${dir}deg)"><path d="M16 3 25 28 16 22 7 28Z" fill="#ff5a1f" stroke="#13304f" stroke-width="2.2" stroke-linejoin="round"/></svg>`
    : `<svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" fill="#ff5a1f" stroke="#13304f" stroke-width="2.4"/></svg>`;
  const s = moving ? 30 : 22;
  const icon = L.divIcon({className:"boat", html:svg, iconSize:[s,s], iconAnchor:[s/2,s/2]});
  if (boatMarker) boatMarker.remove();
  boatMarker = L.marker([last.lat, last.lon], {icon, keyboard:true, title:"Dernière position", zIndexOffset:1000})
    .on("click", () => openPoint(pts.length-1)).addTo(map);
  drawDots();
}

function drawDots(){
  dotLayer.clearLayers();
  if (map.getZoom() < DOTS_MIN_ZOOM || !pts.length) return;
  const b = map.getBounds().pad(.2);
  const vis = [];
  for (let i = 0; i < pts.length; i++) if (b.contains([pts[i].lat, pts[i].lon])) vis.push(i);
  const step = Math.max(1, Math.ceil(vis.length / DOTS_MAX));
  for (let k = 0; k < vis.length; k += step){
    const p = pts[vis[k]];
    L.circleMarker([p.lat, p.lon], {renderer, radius:3.2, color:"#ff5a1f", weight:1.6, fillColor:"#fff", fillOpacity:1, interactive:false}).addTo(dotLayer);
  }
}
map.on("zoomend moveend", drawDots);

// Clic sur la carte : point du tracé le plus proche (rapide même avec 100 000 points).
map.on("click", e => {
  if (!pts.length) return;
  const c = map.latLngToContainerPoint(e.latlng);
  const a = map.containerPointToLatLng([c.x - HIT_PX, c.y - HIT_PX]);
  const z = map.containerPointToLatLng([c.x + HIT_PX, c.y + HIT_PX]);
  const latMin = Math.min(a.lat, z.lat), latMax = Math.max(a.lat, z.lat);
  const lonMin = Math.min(a.lng, z.lng), lonMax = Math.max(a.lng, z.lng);
  let best = -1, bestD = Infinity;
  for (let i = 0; i < pts.length; i++){
    const p = pts[i];
    if (p.lat < latMin || p.lat > latMax || p.lon < lonMin || p.lon > lonMax) continue;
    const pc = map.latLngToContainerPoint([p.lat, p.lon]);
    const d = (pc.x-c.x)**2 + (pc.y-c.y)**2;
    if (d < bestD){ bestD = d; best = i; }
  }
  if (best >= 0) openPoint(best);
});

// ---------- popup d'un point
function dm(v, pos, neg){
  const h = v >= 0 ? pos : neg, a = Math.abs(v), d = Math.floor(a), m = (a - d) * 60;
  return `${d}° ${m.toFixed(3).padStart(6,"0").replace(".", ",")}′ ${h}`;
}
function openPoint(i){
  const p = pts[i], d = new Date(p.t * 1000);
  const rows = [["Position", `${dm(p.lat,"N","S")}<br>${dm(p.lon,"E","O")}`]];
  if (p.sog != null) rows.push(["Vitesse fond", `${nf1.format(p.sog)} nœuds`]);
  if (p.cog != null) rows.push(["Route fond", `${String(p.cog).padStart(3,"0")}°`]);
  if (p.hdg != null) rows.push(["Cap", `${String(p.hdg).padStart(3,"0")}°`]);
  const html = `<div class="pp">
    <p class="pp-date">${cap(fmtDate.format(d))}</p>
    <p class="pp-sub">${fmtUTC.format(d)} UTC${i === pts.length-1 ? ", dernière position connue" : ""}</p>
    <table>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>
    <div class="pp-nav">
      <button data-go="${i-1}" ${i === 0 ? "disabled" : ""}>Point précédent</button>
      <button data-go="${i+1}" ${i === pts.length-1 ? "disabled" : ""}>Point suivant</button>
    </div></div>`;
  if (hilite) hilite.remove();
  hilite = L.circleMarker([p.lat, p.lon], {radius:8, color:"#13304f", weight:2.5, fillColor:"#ff5a1f", fillOpacity:1, interactive:false}).addTo(map);
  L.popup({autoPanPadding:[20, 120], maxWidth:300})
    .setLatLng([p.lat, p.lon]).setContent(html).openOn(map);
}
map.on("popupclose", () => { if (hilite){ hilite.remove(); hilite = null; } });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (!b || b.disabled) return;
  const i = +b.dataset.go;
  if (i >= 0 && i < pts.length){ openPoint(i); map.panTo([pts[i].lat, pts[i].lon]); }
});

// ---------- panneau
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function ago(t){
  const s = Math.max(0, Date.now()/1000 - t);
  if (s < 90) return "à l’instant";
  if (s < 3600) return `il y a ${Math.round(s/60)} min`;
  if (s < 86400){ const h = Math.floor(s/3600), m = Math.round((s%3600)/60); return `il y a ${h} h${m ? " " + String(m).padStart(2,"0") : ""}`; }
  const d = Math.round(s/86400); return `il y a ${d} jour${d > 1 ? "s" : ""}`;
}
function distanceNm(){
  let m = 0;
  for (let i = 1; i < pts.length; i++) m += L.latLng(pts[i-1].lat, pts[i-1].lon).distanceTo([pts[i].lat, pts[i].lon]);
  return m / 1852;
}
function renderPanel(){
  if (!pts.length) return;
  const last = pts[pts.length-1], live = Date.now()/1000 - last.t < LIVE_S;
  const fig = (label, v, unit) => `<div><dt>${label}</dt><dd>${v ?? "—"}${v != null && unit ? `<span>${unit}</span>` : ""}</dd></div>`;
  document.getElementById("content").innerHTML = `
    <p class="when"><span class="live ${live ? "on" : ""}" aria-hidden="true"></span><strong>Dernière position ${ago(last.t)}</strong>
      <span class="abs">${cap(fmtDate.format(new Date(last.t*1000)))}${live ? "" : ". Le système de bord est hors ligne ou éteint ; la position se mettra à jour à son retour."}</span></p>
    <dl class="figs">
      ${fig("Vitesse", last.sog != null ? nf1.format(last.sog) : null, "nds")}
      ${fig("Route", last.cog != null ? String(last.cog).padStart(3,"0") + "°" : null)}
      ${fig("Cap", last.hdg != null ? String(last.hdg).padStart(3,"0") + "°" : null)}
    </dl>
    <p class="trip">${nf0.format(distanceNm())} milles parcourus depuis le ${fmtShort.format(new Date(pts[0].t*1000))}. Touchez ou cliquez le tracé pour voir la date d’un point.</p>
    <div class="actions">
      <button class="primary" id="b-boat">Voir le bateau</button>
      <button id="b-all">Tout le parcours</button>
    </div>`;
  document.getElementById("b-boat").onclick = () => { map.setView([last.lat, last.lon], Math.max(map.getZoom(), 11)); openPoint(pts.length-1); };
  document.getElementById("b-all").onclick = fitAll;
  sheetOffset();
}
function showEmpty(){
  document.getElementById("content").innerHTML =
    `<p class="msg">Aucune position publiée pour l’instant. Elle apparaîtra ici dès que le système de bord sera allumé et connecté.</p>`;
  sheetOffset();
}
function fitAll(){
  if (!pts.length) return;
  if (pts.length === 1){ map.setView([pts[0].lat, pts[0].lon], 11); return; }
  const small = matchMedia("(max-width:600px)").matches;
  const pad = small ? {paddingTopLeft:[30,30], paddingBottomRight:[30, panel.offsetHeight + 20]}
                    : {paddingTopLeft:[panel.offsetWidth + 40, 40], paddingBottomRight:[60,40]};
  map.fitBounds(L.latLngBounds(pts.map(p => [p.lat, p.lon])), {...pad, maxZoom:12});
}

// Bas d'écran mobile : panneau repliable, contrôles de zoom au-dessus.
const panel = document.getElementById("panel"), toggle = document.getElementById("toggle");
function sheetOffset(){ document.documentElement.style.setProperty("--sheet", panel.offsetHeight + "px"); }
toggle.onclick = () => {
  const min = panel.classList.toggle("min");
  toggle.textContent = min ? "▴" : "▾";
  toggle.setAttribute("aria-expanded", String(!min));
  toggle.setAttribute("aria-label", min ? "Déplier le panneau" : "Réduire le panneau");
  sheetOffset();
};
addEventListener("resize", sheetOffset);

load();
setInterval(load, REFRESH_MS);
setInterval(renderPanel, 60 * 1000);
})();
</script>
</body>
</html>
